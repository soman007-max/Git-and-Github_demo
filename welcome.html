<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Heloo Good morning</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    background: #070b14;
    color: #eef1f7;
    text-align: center;
    padding: 24px;
    overflow: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: -20%;
    background:
      radial-gradient(40rem 28rem at 25% 25%, rgba(255,122,24,.22), transparent 60%),
      radial-gradient(38rem 26rem at 75% 75%, rgba(90,120,255,.16), transparent 62%);
    filter: blur(30px);
    animation: drift 18s ease-in-out infinite alternate;
  }

  @keyframes drift {
    from { transform: translate3d(-2%, 1%, 0) scale(1); }
    to   { transform: translate3d(2%, -1%, 0) scale(1.06); }
  }

  .card {
    position: relative;
    padding: 64px 56px;
    border-radius: 24px;
    border: 1px solid rgba(255,255,255,.09);
    background: rgba(255,255,255,.04);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 30px 80px rgba(0,0,0,.5);
    animation: rise .9s cubic-bezier(.16,1,.3,1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(28px); }
    to   { opacity: 1; transform: none; }
  }

  .mark {
    width: 76px; height: 76px;
    margin: 0 auto 28px;
    display: grid; place-items: center;
    border-radius: 20px;
    background: linear-gradient(135deg, #ff7a18, #ffb347);
    color: #17100a;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: -1px;
    animation: glow 4s ease-in-out infinite;
  }

  @keyframes glow {
    0%, 100% { box-shadow: 0 8px 26px rgba(255,122,24,.32); }
    50%      { box-shadow: 0 8px 46px rgba(255,122,24,.70); }
  }

  h1 {
    font-size: clamp(2.2rem, 7vw, 3.8rem);
    font-weight: 800;
    letter-spacing: -1.8px;
    line-height: 1.1;
  }

  .shimmer {
    background: linear-gradient(100deg, #ff7a18, #ffb347 28%, #fff 46%, #ffb347 64%, #ff7a18);
    background-size: 250% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 5s linear infinite;
  }

  @keyframes shine { to { background-position: 250% center; } }

  p {
    margin: 18px auto 34px;
    max-width: 420px;
    color: #8b95ad;
    font-size: 1.02rem;
    line-height: 1.7;
  }

  a {
    display: inline-block;
    padding: 13px 32px;
    border-radius: 11px;
    background: linear-gradient(135deg, #ff7a18, #ffb347);
    color: #180f04;
    font-weight: 600;
    text-decoration: none;
    box-shadow: 0 10px 28px rgba(255,122,24,.32);
    transition: transform .22s ease, box-shadow .22s ease;
  }

  a:hover {
    transform: translateY(-3px);
    box-shadow: 0 16px 40px rgba(255,122,24,.5);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">TE</div>
    <h1>Welcome to <span class="shimmer">TE</span></h1>
    <p>Every connection counts. Glad to have you here.</p>
    <a href="#">Get Started &nbsp;&rarr;</a>
  </div>
</body>
</html>
